[package]
name = "btcfire-wasm"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
rand = { version = "0.9", default-features = false }
rand_chacha = "0.9"
rand_distr = "0.5"

[dev-dependencies]
wasm-bindgen-test = "0.3"
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
